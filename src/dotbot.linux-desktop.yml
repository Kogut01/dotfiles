- defaults:
    link:
        create: true
        relink: true
    create:
        mode: 700

- clean: ['~']

- link:
    ~/.config/bat: ./src/dot_bat
    ~/.config/btop: ./src/dot_btop
    ~/.config/fastfetch: ./src/dot_fastfetch
    ~/.config/git: ./src/dot_git
    ~/.config/lsd: ./src/dot_lsd

- link:
    ~/.config/ghostty: ./src/dot_ghostty
    ~/.config/nvim: ./src/dot_nvim
    ~/.zshrc: ./src/dot_zsh/.zshrc

- link:
    ~/.config/hypr: ./src/dot_hyprland
    ~/.config/hyprpanel: ./src/dot_hyprpanel
    ~/.config/rofi: ./src/dot_rofi
    # /etc/greetd: ./src/dot_greetd_regreet

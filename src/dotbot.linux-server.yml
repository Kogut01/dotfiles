- defaults:
    link:
        create: true
        relink: true
    create:
        mode: 700

- clean: ['~']

- link:
    ~/.config/bat: ./src/dot_bat
    ~/.config/btop: ./src/dot_btop
    ~/.config/fastfetch: ./src/dot_fastfetch
    ~/.config/git: ./src/dot_git
    ~/.config/lsd: ./src/dot_lsd

- link:
    ~/.config/nvim: ./src/dot_nvim
    ~/.zshrc: ./src/dot_zsh/.zshrc
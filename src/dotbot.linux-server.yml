- defaults:
    link:
        create: true
        relink: true
    create:
        mode: 0700

- clean: ['~']

- link:
    ~/.config/bat: ./dot_bat
    ~/.config/btop: ./dot_btop
    ~/.config/fastfetch: ./dot_fastfetch
    ~/.config/git: ./dot_git
    ~/.config/lsd: ./dot_lsd

- link:
    ~/.config/nvim: ./dot_nvim
    ~/.zshrc: ./dot_zsh/.zshrc
    ~/.config/starship.toml: ./dot_starship/starship.toml

# Name of the theme file
color_theme = "Dracula"

# Enable terminal background transparency
theme_background = False

# Enable 24-bit truecolor support
truecolor = True

# Force TTY mode (set to False for normal mode)
force_tty = False

# Rounded corners on boxes
rounded_corners = True

# Default symbols for graph creation
graph_symbol = "braille"

# Graph symbols for specific boxes
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

# Boxes to show
shown_boxes = "cpu mem net proc"

# Update interval in milliseconds
update_ms = 2000

# Sorting processes
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_mem_bytes = True
proc_cpu_graphs = True

# Show CPU temperature and power consumption
check_temp = True
show_cpu_watts = True
show_coretemp = True

# Temperature scale
temp_scale = "celsius"

# Clock format
clock_format = "%X"

# Show battery stats
show_battery = True
show_battery_watts = True

# Log level
log_level = "WARNING"
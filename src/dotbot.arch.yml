- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0700

- clean: ["~"]

- link:
    ~/.config/bat: ./dot_bat
    ~/.config/btop: ./dot_btop
    ~/.config/fastfetch: ./dot_fastfetch
    ~/.config/git: ./dot_git
    ~/.config/lsd: ./dot_lsd
    ~/.config/nvim: ./dot_nvim
    ~/.config/starship: ./dot_starship
    ~/.config/zsh: ./dot_zsh/conf
    ~/.zshrc: ./dot_zsh/.zshrc

- link:
    ~/.config/ghostty: ./dot_ghostty
    ~/.config/hypr: ./dot_hyprland
    ~/.config/hyprpanel: ./dot_hyprpanel
    ~/.config/rofi: ./dot_rofi
    ~/.config/Code/User/settings.json: ./dot_vscode/settings.json
    # /etc/greetd: ./dot_greetd_regreet

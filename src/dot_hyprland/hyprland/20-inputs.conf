#############
### INPUT ###
#############
# configure keyboard, mouse, and touchpad input settings
input {
    kb_layout = pl
    kb_variant =
    kb_model = pc105
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# per-device input configuration
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


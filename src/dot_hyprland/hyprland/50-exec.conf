#################
### AUTOSTART ###
#################
# apps and services to start automatically with Hyprland
exec-once = hyprpanel
exec-once = sudo systemctl start docker

exec-once = swww-daemon
exec-once = swww img /home/kogut01/.dotfiles/data/dot_wallpaper/wallpaper_dark.png

exec-once = hyprctl setcursor Dracula-cursors 24

# portals and authentication agents
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# apps on workspace 2
exec-once = sleep 3 && discord
exec-once = sleep 5 && spotify
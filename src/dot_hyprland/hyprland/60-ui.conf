#####################
### LOOK AND FEEL ###
#####################
# general layout, gaps, borders, and basic compositor options
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(888888aa)

    resize_on_border = false
    allow_tearing = true

    layout = dwindle
}

# window decoration: rounding, opacity, shadows, blur
decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# animations for windows, layers, fading, and workspace switching
animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    bezier = smoothOut, 0.05, 0.9, 0.1, 1.05

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint

    animation = windows, 1, 7, smoothOut
    animation = windowsIn, 1, 6, smoothOut, popin 80%
    animation = windowsOut, 1, 5, smoothOut, popin 80%
    
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = fade, 1, 3, quick
    
    animation = layers, 1, 5, smoothOut
    animation = layersIn, 1, 4, smoothOut, fade
    animation = layersOut, 1, 3.5, smoothOut, fade
    animation = fadeLayersIn, 1, 3, almostLinear
    animation = fadeLayersOut, 1, 2.5, almostLinear
    
    # Przełączanie pulpitów - wydłużone dla efektu "płynięcia"
    animation = workspaces, 1, 7, smoothOut, slide
    animation = workspacesIn, 1, 6, smoothOut, slide
    animation = workspacesOut, 1, 7, smoothOut, slide
}

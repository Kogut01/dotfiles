- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ]; then brew bundle --file=./dot_brew/brewfile_debian; fi'
      stdout: true
      stderr: true

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ] && ! command -v zsh >/dev/null 2>&1; then sudo apt install -y zsh; fi'
      stdout: true
      stderr: true

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ] && [ "$(basename "$SHELL")" != "zsh" ]; then sudo chsh -s "$(command -v zsh)" "$USER"; fi'
      stdout: true
      stderr: true

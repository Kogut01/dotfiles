- link:
    ~/.config/ghostty: ./dot_ghostty
    ~/.config/zed/settings.json: ./dot_zed/settings.json
    ~/.hushlogin: ./dot_hushlogin/hushlogin

- link:
    ~/Library/Fonts/MesloLGLNerdFont-Regular.ttf: ../data/fonts/meslo/ttf/MesloLGLNerdFont-Regular.ttf
    ~/Library/Fonts/MesloLGLNerdFont-Bold.ttf: ../data/fonts/meslo/ttf/MesloLGLNerdFont-Bold.ttf
    ~/Library/Fonts/MesloLGLNerdFont-Italic.ttf: ../data/fonts/meslo/ttf/MesloLGLNerdFont-Italic.ttf
    ~/Library/Fonts/MesloLGLNerdFont-BoldItalic.ttf: ../data/fonts/meslo/ttf/MesloLGLNerdFont-BoldItalic.ttf

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ]; then brew bundle --file=./dot_brew/brewfile_macos; fi'
      stdout: true
      stderr: true

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ] && [ "$(basename "$SHELL")" != "zsh" ]; then sudo chsh -s "$(command -v zsh)" "$USER"; fi'
      stdout: true
      stderr: true

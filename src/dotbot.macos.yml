- defaults:
    link:
        create: true
        relink: true
    create:
        mode: 0700

- clean: ['~']

- link:
    ~/.config/bat: ./dot_bat
    ~/.config/btop: ./dot_btop
    ~/.config/fastfetch: ./dot_fastfetch
    ~/.config/git: ./dot_git
    ~/.config/lsd: ./dot_lsd
    ~/.config/nvim: ./dot_nvim

- link:
    ~/.config/ghostty: ./dot_ghostty
    ~/.zshrc: ./dot_zsh/.zshrc
    ~/.config/starship.toml: ./dot_starship/starship.toml

- link:
    ~/.hushlogin: ./dot_hushlogin/hushlogin
    ~/Library/Application\ Support/Code/User/settings.json: ./dot_vscode/settings.json

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ]; then brew bundle --file=./dot_brew/Brewfile; fi'
      stdout: true
      stderr: true
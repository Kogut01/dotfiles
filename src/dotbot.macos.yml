- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0700

- clean: ["~"]

- link:
    ~/.config/bat: ./dot_bat
    ~/.config/btop: ./dot_btop
    ~/.config/fastfetch: ./dot_fastfetch
    ~/.config/git: ./dot_git
    ~/.config/lsd: ./dot_lsd
    ~/.config/nvim: ./dot_nvim
    ~/.config/starship: ./dot_starship
    ~/.config/zsh: ./dot_zsh/conf
    ~/.zshrc: ./dot_zsh/.zshrc

- link:
    ~/.config/zed/settings.json: ./dot_zed/settings.json
    ~/.config/ghostty: ./dot_ghostty
    ~/.hushlogin: ./dot_hushlogin/hushlogin

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ]; then brew bundle --file=./dot_brew/brewfile_macos; fi'
      stdout: true
      stderr: true

- shell:
    - command: 'if [ -z "$GITHUB_ACTIONS" ] && [ "$(basename "$SHELL")" != "zsh" ]; then sudo chsh -s "$(which zsh)"; fi'
      stdout: true
      stderr: true

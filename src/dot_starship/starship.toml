# --------------------------
# 0. Starship Configuration
# --------------------------
format = """
$time\
$shell\
$git_branch\
$git_status\
$fill\
$docker_context\
$kubernetes\
$python\
$nodejs\
$golang\
$hostname\
$sudo\
$line_break\
$directory\
$line_break\
$character\
"""

[fill]
symbol = " "


# --------------
# 1. First line
# --------------
[time]
disabled = false
time_format = "%H:%M"
format = "[\\[$time\\]]($style) "
style = "yellow"

[shell]
disabled = false
format = "[  $indicator]($style) "
style = "red"

[git_branch]
format = "[$symbol$branch ]($style)"
symbol = " "
style = "green"

[git_status]
format = "([$ahead_behind$all_status]($style))"
ahead = " ${count}"
behind = " ${count}"
diverged = " ${ahead_count}  ${behind_count}"
conflicted = " ${count} "
untracked = "󰛑 ${count} "
modified = " ${count} "
staged = "󰛐 ${count} "
renamed = " ${count} "
deleted = " ${count} "
stashed = " ${count} "
style = "yellow"

[docker_context]
format = "[$symbol$context]($style)"

[kubernetes]
format = "[$symbol$context]($style)"

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style)"

[nodejs]
format = "[$symbol$version]($style)"

[golang]
format = "[$symbol$version]($style)"

[hostname]
disabled = false
format = "[$ssh_symbol]($style)"
ssh_symbol = " "
style = "green"

[sudo]
disabled = false
format = "[$symbol]($style) "
symbol = "  "
style = "red"


# ---------------
# 2. Second line
# ---------------
[directory]
format = "[  $path]($style)"
truncate_to_repo = false
truncation_length = 0
style = "blue"


# --------------
# 3. Third line
# --------------
[character]
success_symbol = "[❯](bold red)"
error_symbol = "[❯](bold red)"
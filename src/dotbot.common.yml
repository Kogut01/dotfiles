- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0700

- clean:
    "~":
      force: false
    "~/.config":
      recursive: true

- link:
    ~/.config/bat: ./dot_bat
    ~/.config/btop: ./dot_btop
    ~/.config/fastfetch: ./dot_fastfetch
    ~/.config/fd: ./dot_fd
    ~/.config/git: ./dot_git
    ~/.config/lsd: ./dot_lsd
    ~/.config/nvim: ./dot_nvim
    ~/.config/starship: ./dot_starship
    ~/.config/superfile/config.toml: ./dot_superfile/config.toml
    ~/.config/zsh: ./dot_zsh/conf
    ~/.zshrc: ./dot_zsh/.zshrc
